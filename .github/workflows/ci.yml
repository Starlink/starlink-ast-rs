name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    # Cover both glibc x86_64 (ubuntu-latest) and Apple aarch64 (macos-latest)
    # so platform-specific libm precision issues surface in CI rather than
    # only on developer machines. The sky_circle_open_boundary test that
    # added macos-latest was originally caught only ever revealed itself
    # locally because pal::dsep happens to be bit-symmetric under glibc
    # but asymmetric by 1 ULP under Apple's libm.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test -p ast-core

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
