[workspace]
members = ["crates/*"]
default-members = [
    "crates/ast-core",
    "crates/ast-capi",
    "crates/ast-plugins",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
repository = "https://github.com/lsst-dm/starlink-astrs"

[workspace.dependencies]
cc = "1"
levenberg-marquardt = "0.15"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
ndarray = "0.16"

# Workspace-wide lint configuration. Mirrors CI's
# `RUSTFLAGS=-D warnings` so warnings surface as errors during local
# `cargo build`/`cargo test` instead of slipping into the GitHub
# Actions build. Each crate inherits via `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"
