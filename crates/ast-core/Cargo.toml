[package]
name = "ast-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust port of the Starlink AST world coordinate system library"

[lints]
workspace = true

[dependencies]
levenberg-marquardt.workspace = true
nalgebra.workspace = true
ndarray.workspace = true
wide = { version = "0.7", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Lets the examples print the `ast::simplify` events the `tracing` feature emits;
# a library never installs a subscriber itself.
tracing-subscriber = { workspace = true }

[features]
# Opt-in prototypes used for measurement (cross-lane SIMD eval, etc.). Off by
# default. Production code never depends on this — it exposes `pub fn` entry
# points so that `cargo bench` / examples can compare paths.
simd-eval = ["dep:wide"]

# Emit every constructed `AstError` as a `tracing::error!` event. Off by
# default so the library has no logging dependency in the common case; the
# spec (docs/superpowers/specs/2026-04-20-rust-port-design.md, "Error model")
# calls for it as an opt-in debugging aid.
tracing = ["dep:tracing"]

[[example]]
name = "bench_polymap_simd"
required-features = ["simd-eval"]

[build-dependencies]
cc.workspace = true
