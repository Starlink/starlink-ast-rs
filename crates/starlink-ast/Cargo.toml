[package]
name = "starlink-ast"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World coordinate systems for astronomy: a pure-Rust port of the Starlink AST library (FITS-WCS, celestial, spectral and time frames)"
documentation = "https://docs.rs/starlink-ast"
readme = "README.md"
keywords = ["astronomy", "wcs", "fits", "coordinates", "starlink"]
categories = ["science"]
# The files in tests/ are modules of a few test programs, one per area, each
# tests/<area>/main.rs, rather than one program each: every test program links
# all of starlink-ast, and on macOS each new program is scanned on its first run,
# so one program per file made the test suite take most of an hour.
autotests = false
# What the archive carries. tests/fixtures/ ships the subset that
# tests/fixtures/DIST_MANIFEST names, as the C library's `make dist` does;
# tests/test_dist_manifest.rs fails if the two lists differ. tests/DIST_TIER
# stays behind: its absence tells build.rs the tree is cut down.
# tests/wcslib_golden/, the projections' bits captured from the wcslib C, and
# tests/erfa_pal_golden/, the PAL routines' bits captured from the PAL and ERFA C,
# stay behind too, as does tests/bench_lsst_c.c, a benchmark program for the
# C library that the archive's build, which compiles no C, has no use for.
include = [
    "/build.rs",
    "/clippy.toml",
    "/COPYRIGHT",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/vendor/**",
    "/examples/**",
    "/tests/**",
    "!/tests/DIST_TIER",
    "!/tests/fixtures/**",
    "!/tests/wcslib_golden/**",
    "!/tests/erfa_pal_golden/**",
    "!/tests/bench_lsst_c.c",
    # DIST_MANIFEST, entry for entry.
    "/tests/fixtures/DIST_MANIFEST",
    "/tests/fixtures/programs/**",
    "/tests/fixtures/plot/cases.txt",
    "/tests/fixtures/plot/expected/*.svg",
    "/tests/fixtures/wcsconv/inputs/**",
    "/tests/fixtures/oracle/headers.oracle",
    "/tests/fixtures/oracle/transform_oracle_overrides.txt",
    "/tests/fixtures/oracle/README.md",
    "/tests/fixtures/simplify/cases.txt",
    "/tests/fixtures/wcsconv/cases.txt",
]

[lints]
workspace = true

[dependencies]
levenberg-marquardt.workspace = true
nalgebra.workspace = true
ndarray.workspace = true
smallvec.workspace = true
wide = { version = "0.7", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Lets the examples print the `ast::simplify` events the `tracing` feature emits;
# a library never installs a subscriber itself.
tracing-subscriber = { workspace = true }
# Derives the enclosing item of an audit-checklist citation; used by
# `test_audit_citations.rs`.
audit-tools = { path = "../audit-tools" }

[features]
# Opt-in prototypes used for measurement (cross-lane SIMD eval, etc.). Off by
# default. Production code never depends on this — it exposes `pub fn` entry
# points so that `cargo bench` / examples can compare paths.
simd-eval = ["dep:wide"]

# Emit every constructed `AstError` as a `tracing::error!` event. Off by
# default so the library has no logging dependency in the common case; the
# spec (docs/superpowers/specs/2026-04-20-rust-port-design.md, "Error model")
# calls for it as an opt-in debugging aid.
tracing = ["dep:tracing"]

# Count calls into libm, PAL, ERFA and wcslib, keyed by C function name, for
# checking that the port makes the same calls as C (`starlink_ast::call_counts`).
# Never enable in a timed build.
call-counts = []

[[example]]
name = "count_one"
required-features = ["call-counts"]

[[example]]
name = "bench_polymap_simd"
required-features = ["simd-eval"]

[[test]]
name = "mappings"
path = "tests/mappings/main.rs"

[[test]]
name = "frames"
path = "tests/frames/main.rs"

[[test]]
name = "domain_frames"
path = "tests/domain_frames/main.rs"

[[test]]
name = "regions"
path = "tests/regions/main.rs"

[[test]]
name = "fitschan"
path = "tests/fitschan/main.rs"

[[test]]
name = "serial"
path = "tests/serial/main.rs"

[[test]]
name = "meta"
path = "tests/meta/main.rs"
