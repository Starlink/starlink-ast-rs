[package]
name = "starlink-ast"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust port of the Starlink AST world coordinate system library"
# The files in tests/ are modules of a few test programs, one per area, each
# tests/<area>/main.rs, rather than one program each: every test program links
# all of starlink-ast, and on macOS each new program is scanned on its first run,
# so one program per file made the test suite take most of an hour.
autotests = false

[lints]
workspace = true

[dependencies]
levenberg-marquardt.workspace = true
nalgebra.workspace = true
ndarray.workspace = true
smallvec.workspace = true
wide = { version = "0.7", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Lets the examples print the `ast::simplify` events the `tracing` feature emits;
# a library never installs a subscriber itself.
tracing-subscriber = { workspace = true }
# Derives the enclosing item of an audit-checklist citation; used by
# `test_audit_citations.rs`.
audit-tools = { path = "../audit-tools" }

[features]
# Opt-in prototypes used for measurement (cross-lane SIMD eval, etc.). Off by
# default. Production code never depends on this — it exposes `pub fn` entry
# points so that `cargo bench` / examples can compare paths.
simd-eval = ["dep:wide"]

# Emit every constructed `AstError` as a `tracing::error!` event. Off by
# default so the library has no logging dependency in the common case; the
# spec (docs/superpowers/specs/2026-04-20-rust-port-design.md, "Error model")
# calls for it as an opt-in debugging aid.
tracing = ["dep:tracing"]

# Count calls into libm, PAL, ERFA and wcslib, keyed by C function name, for
# checking that the port makes the same calls as C (`starlink_ast::call_counts`).
# Never enable in a timed build.
call-counts = []

[[example]]
name = "count_one"
required-features = ["call-counts"]

[[example]]
name = "bench_polymap_simd"
required-features = ["simd-eval"]

[build-dependencies]
cc.workspace = true

[[test]]
name = "mappings"
path = "tests/mappings/main.rs"

[[test]]
name = "frames"
path = "tests/frames/main.rs"

[[test]]
name = "domain_frames"
path = "tests/domain_frames/main.rs"

[[test]]
name = "regions"
path = "tests/regions/main.rs"

[[test]]
name = "fitschan"
path = "tests/fitschan/main.rs"

[[test]]
name = "serial"
path = "tests/serial/main.rs"

[[test]]
name = "meta"
path = "tests/meta/main.rs"
